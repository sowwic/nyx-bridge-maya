site_name: nyx-bridge-maya Documentation
site_description: Documentation for nyx-bridge-maya.
site_author: Dima Shevchenko
theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.superfences

plugins:
  - search
  - mkdocs-autoapi:
      autoapi_dir: "src/nyx_bridge_maya"
      autoapi_ignore:
        - "**/version.py"
        
        - "**/resources/*"
        - "**/main.py"
      autoapi_file_patterns:
        - "*.py"
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/nyx_bridge_maya"]
          options:
            docstring_style: google
            show_signature: true
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true
  - autorefs

nav:
  - Home: index.md
  - User Guide:
      - user/index.md
      - Installation: user/installation.md
      - Connecting Maya to Nyx: user/connecting.md
      - Starting Maya from a stage: user/standalone.md
  - Developer Guide:
      - dev/index.md
      - Architecture: dev/architecture.md
      - Testing: dev/testing.md
      - Releasing: dev/releasing.md
